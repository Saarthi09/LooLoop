<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loo Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="wordmark">Loo Loop</h1>
    <p class="standfirst" id="standfirst">Checking what's on near Queen &amp; Spadina.</p>
  </header>

  <main class="frame">
    <section class="stage">
      <div class="toolbar">
        <div class="switch" id="views" role="group" aria-label="View"></div>
        <div class="switch" id="spans" role="group" aria-label="Hours shown"></div>
      </div>

      <div class="canvas-wrap" id="canvas-wrap">
        <svg class="radial" id="radial" role="group" aria-label="Tonight, arranged by start time and travel time"></svg>
        <div class="tip" id="tip" aria-hidden="true" hidden></div>
      </div>

      <div class="list" id="list" hidden></div>

      <p class="empty" id="empty" hidden>Nothing fits that window. Try widening the time or the travel distance.</p>
      <p class="legend" id="legend"></p>
    </section>

    <aside class="rail" id="rail" aria-label="Filters"></aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
