<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your LooLoop recommendations</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <nav>
        <a href="/">Loo<span>Loop</span></a>
        <div class="nav-actions">
          <a class="circles-link" href="/">Edit preferences</a>
          <a class="circles-link" href="circles.html">View circles →</a>
        </div>
      </nav>

      <section class="hero results-hero">
        <p class="eyebrow">YOUR NEW-STUDENT GUIDE</p>
        <h1>Find your next<br /><em>campus moment.</em></h1>
        <p id="recommendation-summary">
          Discover newcomer-friendly events selected around your interests and
          circumstances.
        </p>
        <form id="search-form">
          <label>
            What are you into?
            <input
              id="keyword"
              name="keyword"
              placeholder="e.g. live music, technology"
            />
          </label>
          <label>
            Where?
            <input id="city" name="city" value="Waterloo" required />
          </label>
          <button>Find events →</button>
        </form>
        <div class="quick">
          Try:
          <button data-interest="comedy">Comedy</button>
          <button data-interest="music">Live music</button>
          <button data-interest="sports">Sports</button>
          <button data-interest="arts">Arts</button>
        </div>
        <button id="university-events" class="university-button" type="button">
          🎓 University of Waterloo events
        </button>
      </section>

      <section>
        <div class="heading">
          <div>
            <p class="eyebrow">RECOMMENDED FOR YOU</p>
            <h2 id="result-title">Your newcomer picks</h2>
          </div>
          <p id="status">Preparing your recommendations…</p>
        </div>
        <div id="results" class="grid">
          <p class="empty">Looking for events that fit you…</p>
        </div>
      </section>
    </main>

    <template id="event-template">
      <article>
        <div class="event-image-wrap">
          <img />
          <span class="match-badge" hidden></span>
        </div>
        <div>
          <p class="date"></p>
          <h3></h3>
          <p class="venue"></p>
          <p class="source"></p>
          <ul class="match-reasons"></ul>
          <a target="_blank" rel="noreferrer">Details ↗</a>
        </div>
      </article>
    </template>

    <script src="first.js"></script>
  </body>
</html>
